<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora — Aurora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Direction 3 — Aurora. The mint stays. A rail on the left that opens when
     the remote reaches it, the way Google TV's does, and a spotlight that
     becomes whatever you are on, so the rows stay small and dense and the
     screen still always shows one thing large. Drawn at 1920x1080. */
  :root { --bg: #060a0e; --panel: #0e151c; --line: rgba(160,220,210,.10); --text: #eef6f4; --dim: #9fb1ae; --faint: #5f716e; --mint: #7df7dc; --mint-deep: #1f6b5f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: Inter, system-ui, sans-serif; color: var(--text); }
  .stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: var(--bg); overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  :focus { outline: none; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }

  /* ---- the rail ---- */
  .rail { position: absolute; z-index: 30; left: 0; top: 0; bottom: 0; width: 132px; padding: 44px 24px; display: flex; flex-direction: column; gap: 10px;
    background: linear-gradient(90deg, rgba(6,10,14,.98) 60%, rgba(6,10,14,0)); transition: width .18s ease; }
  .rail:focus-within { width: 420px; background: linear-gradient(90deg, rgba(6,10,14,.99) 78%, rgba(6,10,14,.0)); }
  .rail .face { width: 84px; height: 84px; border-radius: 22px; background: linear-gradient(140deg, var(--mint), #3fb7c9); color: #052019; display: grid; place-items: center; font-weight: 800; font-size: 32px; font-family: "Bricolage Grotesque"; margin-bottom: 40px; flex: 0 0 auto; }
  .rail button { height: 76px; border-radius: 20px; display: flex; align-items: center; gap: 26px; padding: 0 23px; color: var(--dim); white-space: nowrap; overflow: hidden; flex: 0 0 auto; }
  .rail button svg { flex: 0 0 38px; width: 38px; height: 38px; }
  .rail button span { font-size: 30px; font-weight: 600; opacity: 0; transition: opacity .12s ease; }
  .rail:focus-within button span { opacity: 1; }
  .rail button.on { color: var(--mint); }
  .rail button:focus { background: var(--mint); color: #052019; }
  .rail .grow { flex: 1; }

  /* ---- the spotlight: whatever you are on ---- */
  .spot { position: absolute; left: 0; right: 0; top: 0; height: 640px; }
  .spot img.bd { position: absolute; right: 0; top: 0; width: 1340px; height: 754px; object-fit: cover; transition: opacity .25s ease; }
  .spot::after { content: ""; position: absolute; inset: 0 0 -114px; background:
      linear-gradient(90deg, var(--bg) 26%, rgba(6,10,14,.75) 44%, rgba(6,10,14,0) 72%),
      linear-gradient(0deg, var(--bg) 14%, rgba(6,10,14,0) 50%); }
  .spot .copy { position: absolute; z-index: 2; left: 200px; top: 96px; width: 900px; }
  .eyebrow { font-family: "JetBrains Mono"; font-size: 24px; font-weight: 600; letter-spacing: .14em; color: var(--mint); text-transform: uppercase; margin-bottom: 18px; }
  .spot h1 { font-family: "Bricolage Grotesque"; font-size: 96px; font-weight: 800; letter-spacing: -.035em; line-height: .95; margin: 0 0 22px; max-width: 900px; }
  .spot .logo { max-width: 600px; max-height: 190px; display: block; margin-bottom: 24px; }
  .chips { display: flex; gap: 12px; margin-bottom: 20px; }
  .chips span { font-family: "JetBrains Mono"; font-size: 24px; font-weight: 600; padding: 6px 16px; border-radius: 10px; background: rgba(125,247,220,.10); color: var(--text); }
  .chips span.score { background: var(--mint); color: #052019; }
  .spot p { font-size: 30px; line-height: 1.45; color: #c3d2cf; margin: 0 0 30px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .actions { display: flex; gap: 16px; }
  /* while you browse the rows the spotlight only describes; its buttons are
     there when you go up into it, as Google TV's are */
  .spot .actions { opacity: 0; transition: opacity .15s ease; }
  .spot:focus-within .actions { opacity: 1; }
  .spot h1.long { font-size: 72px; }
  .btn { height: 76px; padding: 0 40px; border-radius: 22px; font-size: 30px; font-weight: 700; display: inline-flex; align-items: center; gap: 14px; white-space: nowrap; background: rgba(238,246,244,.10); }
  .btn.primary { background: var(--mint); color: #052019; }
  .btn:focus { box-shadow: 0 0 0 4px var(--bg), 0 0 0 8px var(--text); }
  .btn svg { width: 30px; height: 30px; }

  /* ---- the rows ---- */
  .page { position: absolute; left: 0; right: 0; top: 600px; bottom: 0; overflow: hidden; }
  section { padding: 0 0 44px; }
  .head { padding: 0 0 0 200px; margin-bottom: 18px; display: flex; align-items: baseline; gap: 18px; }
  h2 { margin: 0; font-family: "Bricolage Grotesque"; font-size: 40px; font-weight: 700; letter-spacing: -.02em; }
  .head small { font-family: "JetBrains Mono"; font-size: 22px; color: var(--faint); }
  .row { display: flex; gap: 24px; padding: 22px 120px 26px 200px; margin: -22px 0 -26px; overflow: hidden; }

  .poster { flex: 0 0 200px; position: relative; }
  .poster .art { width: 200px; aspect-ratio: 2/3; border-radius: 20px; overflow: hidden; background: var(--panel); transition: transform .12s ease; }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .poster:focus .art { transform: scale(1.06); box-shadow: 0 0 0 4px var(--bg), 0 0 0 9px var(--mint), 0 22px 46px rgba(0,0,0,.6); }

  .wide { flex: 0 0 420px; }
  .wide .art { position: relative; width: 420px; aspect-ratio: 16/9; border-radius: 20px; overflow: hidden; background: var(--panel); transition: transform .12s ease; }
  .wide img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .wide .bar { position: absolute; left: 20px; right: 20px; bottom: 18px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.22); }
  .wide .bar i { display: block; height: 100%; border-radius: 4px; background: var(--mint); }
  .wide .left { position: absolute; left: 20px; top: 16px; font-family: "JetBrains Mono"; font-size: 22px; font-weight: 600; background: rgba(6,10,14,.82); padding: 4px 12px; border-radius: 8px; }
  .wide:focus .art { transform: scale(1.05); box-shadow: 0 0 0 4px var(--bg), 0 0 0 9px var(--mint), 0 22px 46px rgba(0,0,0,.6); }

  .ranked { flex: 0 0 auto; display: flex; align-items: flex-end; }
  .ranked .n { font-family: "Bricolage Grotesque"; font-size: 220px; font-weight: 800; line-height: .76; letter-spacing: -.08em; margin-right: -30px;
    background: linear-gradient(180deg, rgba(125,247,220,.55), rgba(125,247,220,.04)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .ranked:focus .n { background: linear-gradient(180deg, var(--mint), rgba(125,247,220,.25)); -webkit-background-clip: text; background-clip: text; }
  .ranked .poster { flex: 0 0 180px; }
  .ranked .poster .art { width: 180px; }
  .ranked:focus .poster .art { transform: scale(1.06); box-shadow: 0 0 0 4px var(--bg), 0 0 0 9px var(--mint); }

  .cats { display: flex; gap: 16px; padding: 0 120px 0 200px; flex-wrap: wrap; }
  .cats button { height: 72px; padding: 0 30px; border-radius: 999px; font-size: 28px; font-weight: 600; background: rgba(238,246,244,.06); border: 1px solid var(--line); color: var(--dim); }
  .cats button:focus { background: var(--mint); color: #052019; border-color: var(--mint); }
  .cats button[dir="rtl"] { font-family: Inter, "Geeza Pro", system-ui; }

  .sheet { position: absolute; inset: 0; z-index: 50; background: var(--bg); }
  .sheet img.bd { position: absolute; right: 0; top: 0; width: 1400px; height: 100%; object-fit: cover; }
  .sheet::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--bg) 30%, rgba(6,10,14,.55) 55%, rgba(6,10,14,.1)); }
  .sheet .copy { position: absolute; z-index: 2; left: 200px; top: 220px; width: 900px; }
  .sheet h1 { font-family: "Bricolage Grotesque"; font-size: 104px; font-weight: 800; letter-spacing: -.04em; line-height: .95; margin: 0 0 24px; }
  .sheet p { font-size: 32px; line-height: 1.45; color: #c3d2cf; margin: 0 0 34px; }
</style>
</head>
<body data-menu="left">
<div class="stage">
  <div class="spot" id="spot"></div>
  <div class="page" data-page data-keep="16" id="page"></div>
  <nav class="rail" data-chrome>
    <div class="face">ZE</div>
    <button data-f><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Search</span></button>
    <button data-f class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg><span>Home</span></button>
    <button data-f><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="m8 2 4 4 4-4"/></svg><span>Live TV</span></button>
    <button data-f><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg><span>Movies</span></button>
    <button data-f><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8"/></svg><span>Series</span></button>
    <button data-f><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span>My list</span></button>
    <div class="grow"></div>
    <button data-f><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Settings</span></button>
  </nav>
  <div class="sheet" data-layer hidden id="sheet"></div>
</div>
<script src="shared.js"></script>
<script>
(async () => {
  const { esc, load, start, focus } = Direction;
  const d = await load();
  const all = [...d.heroes, ...d.movies, ...d.shows, ...d.top, ...d.arabic, ...d.animation];
  const byId = (id) => all.find((x) => String(x.id) === String(id));
  const play = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
  const plus = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>';
  const kind = (x) => (x.type === "tv" ? "SERIES" : "FILM");

  const spot = document.getElementById("spot");
  let shown = null;
  function spotlight(x, eyebrow) {
    if (!x || shown === x.id) return; shown = x.id;
    const logo = d.heroes.find((h) => h.id === x.id)?.logo;
    spot.innerHTML = `<img class="bd" src="${esc(x.backdrop)}" alt=""><div class="copy">
      <div class="eyebrow">${esc(eyebrow || (x.type === "tv" ? "Series worth starting" : "Worth your evening"))}</div>
      ${logo ? `<img class="logo" src="${esc(logo)}" alt="${esc(x.title)}">` : `<h1 class="${x.title.length > 18 ? "long" : ""}">${esc(x.title)}</h1>`}
      <div class="chips"><span class="score">★ ${esc(x.rating)}</span><span>${esc(x.year)}</span><span>${kind(x)}</span><span>4K</span></div>
      <p>${esc(x.overview)}</p>
      <div class="actions"><button class="btn primary" data-f data-start data-id="${x.id}">${play}Play</button><button class="btn" data-f>${plus}My list</button></div></div>`;
  }
  spotlight(d.heroes[0]);

  const poster = (x) => `<button class="poster" data-f data-id="${x.id}"><div class="art"><img src="${esc(x.poster)}" alt=""></div></button>`;
  const row = (title, items, note = "") => `<section data-section><div class="head"><h2>${esc(title)}</h2><small>${esc(note)}</small></div><div class="row" data-row>${items.join("")}</div></section>`;
  document.getElementById("page").innerHTML = `
    ${row("Continue watching", d.shows.slice(3, 9).map((x, i) => `<button class="wide" data-f data-id="${x.id}" data-eyebrow="Carry on · S${i + 1} E${(i * 3) % 9 + 2}"><div class="art"><img src="${esc(x.still)}" alt=""><span class="left">${[22, 41, 8, 51, 30, 17][i]} min left</span><div class="bar"><i style="width:${[72, 35, 88, 15, 54, 61][i]}%"></i></div></div></button>`), "on this TV")}
    ${row("Top 20 on your line", d.movies.slice(0, 20).map((x, i) => `<button class="ranked" data-f data-id="${x.id}" data-eyebrow="Number ${i + 1} this week"><span class="n">${i + 1}</span><div class="poster"><div class="art"><img src="${esc(x.poster)}" alt=""></div></div></button>`), "this week")}
    ${row("Series worth starting", d.shows.map(poster))}
    <section data-section><div class="head"><h2>Your categories</h2><small>from your provider</small></div><div class="cats">
      ${["Netflix Original", "أفلام عربية", "HBO", "Prime Video", "مسلسلات تركية", "Kids", "Documentary", "Sports", "Anime", "2020 & older"]
        .map((c) => `<button data-f ${/[؀-ۿ]/.test(c) ? 'dir="rtl"' : ""}>${esc(c)}</button>`).join("")}</div></section>
    ${row("Top rated, all time", d.top.map(poster))}
    ${row("Arabic cinema", d.arabic.map(poster))}
    ${row("Animation", d.animation.map(poster))}
    <div style="height:200px"></div>`;

  // the spotlight follows the remote
  document.addEventListener("direction:focus", (e) => {
    const el = e.detail; if (!el || el.closest(".spot, .sheet")) return;
    const x = el.dataset.id && byId(el.dataset.id);
    if (x) spotlight(x, el.dataset.eyebrow);
  });

  const sheet = document.getElementById("sheet");
  let opener = null;
  document.querySelector(".stage").addEventListener("click", (e) => {
    const el = e.target.closest("[data-id]"); if (!el || el.closest(".sheet")) return;
    const x = byId(el.dataset.id); if (!x) return;
    opener = el;
    sheet.innerHTML = `<img class="bd" src="${esc(x.backdrop)}" alt=""><div class="copy"><div class="eyebrow">${x.type === "tv" ? "Series" : "Film"}</div><h1>${esc(x.title)}</h1><div class="chips"><span class="score">★ ${esc(x.rating)}</span><span>${esc(x.year)}</span><span>${kind(x)}</span></div><p>${esc(x.overview)}</p><div class="actions"><button class="btn primary" data-f>${play}Play</button><button class="btn" data-f>${plus}My list</button><button class="btn" data-f>Trailer</button></div></div>`;
    sheet.hidden = false; focus(sheet.querySelector("[data-f]"));
  });
  document.addEventListener("direction:back", () => { if (!sheet.hidden) { sheet.hidden = true; focus(opener); } });
  start();
})();
</script>
</body>
</html>
