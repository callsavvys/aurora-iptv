<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora — Cinexa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Direction 4 — after Cinexa. Ultra-minimal: near-black, a faint grid, one
     white pill, two tones of type and nothing else. Drawn at 1920x1080. */
  :root { --bg: #0c0c0e; --panel: #141417; --line: rgba(255,255,255,.07); --text: #fafafa; --grey: #8b8b93; --faint: #55555c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: "Plus Jakarta Sans", system-ui, sans-serif; color: var(--text); }
  .stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: var(--bg); overflow: hidden; }
  .stage::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 96px 96px; mask-image: radial-gradient(ellipse 70% 60% at 50% 0%, #000 20%, transparent 75%); -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 0%, #000 20%, transparent 75%); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  :focus { outline: none; }

  .top { position: absolute; z-index: 20; left: 0; right: 0; top: 0; height: 140px; padding: 0 112px; display: flex; align-items: center; justify-content: space-between; }
  .top::before { content: ""; position: absolute; inset: 0 0 -40px; z-index: -1; background: linear-gradient(180deg, var(--bg) 65%, rgba(12,12,14,0)); opacity: 0; transition: opacity .2s; }
  .scrolled .top::before { opacity: 1; }
  .mark { font-size: 32px; font-weight: 800; letter-spacing: .14em; }
  .mark i { font-style: normal; color: var(--grey); }
  .links { display: flex; gap: 8px; }
  .links button { height: 58px; padding: 0 26px; border-radius: 999px; font-size: 27px; font-weight: 600; color: var(--grey); }
  .links button.on { color: var(--text); }
  .links button:focus { background: var(--text); color: #000; }
  .me { display: flex; gap: 12px; }
  .me button { height: 58px; padding: 0 26px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14); font-size: 26px; font-weight: 600; display: flex; align-items: center; gap: 12px; }
  .me button:focus { background: var(--text); color: #000; border-color: var(--text); }
  .me svg { width: 26px; height: 26px; }

  .page { position: absolute; inset: 0; overflow: hidden; z-index: 1; }
  .hero { position: relative; height: 820px; }
  .hero > img { position: absolute; right: 0; top: 0; width: 1240px; height: 760px; object-fit: cover; opacity: .55; filter: saturate(.75);
    mask-image: radial-gradient(ellipse 80% 85% at 75% 35%, #000 30%, transparent 78%); -webkit-mask-image: radial-gradient(ellipse 80% 85% at 75% 35%, #000 30%, transparent 78%); }
  .copy { position: absolute; z-index: 2; left: 112px; top: 250px; width: 980px; }
  .now { display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 20px; border-radius: 999px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.03); font-size: 22px; font-weight: 600; color: var(--grey); margin-bottom: 30px; }
  .now::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--text); }
  h1 { margin: 0 0 26px; font-size: 112px; line-height: .98; letter-spacing: -.045em; font-weight: 800; }
  h1 span { display: block; color: var(--grey); }
  .copy p { font-size: 30px; line-height: 1.5; color: var(--grey); margin: 0 0 40px; max-width: 780px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .actions { display: flex; align-items: center; gap: 30px; }
  .pill { height: 76px; padding: 0 42px; border-radius: 999px; background: var(--text); color: #000; font-size: 29px; font-weight: 700; display: inline-flex; align-items: center; gap: 14px; white-space: nowrap; }
  .link { height: 76px; padding: 0 12px; font-size: 28px; font-weight: 600; color: var(--grey); text-decoration: underline; text-underline-offset: 8px; text-decoration-color: rgba(255,255,255,.25); white-space: nowrap; }
  .pill:focus { box-shadow: 0 0 0 5px var(--bg), 0 0 0 9px var(--text); }
  .link:focus { color: var(--text); text-decoration-color: var(--text); }

  section { padding: 0 0 64px; }
  h2 { margin: 0 0 24px; padding: 0 112px; font-size: 32px; font-weight: 600; color: var(--grey); letter-spacing: -.01em; }
  .row { display: flex; gap: 30px; padding: 22px 112px 26px; margin: -22px 0 -26px; overflow: hidden; }
  .poster { flex: 0 0 236px; }
  .poster .art { width: 236px; aspect-ratio: 2/3; border-radius: 16px; overflow: hidden; background: var(--panel); border: 1px solid var(--line); }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity .15s; opacity: .92; }
  .poster .t { margin-top: 16px; font-size: 24px; font-weight: 600; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .poster:focus .art { box-shadow: 0 0 0 5px var(--bg), 0 0 0 9px var(--text); }
  .poster:focus img { opacity: 1; }
  .poster:focus .t { color: var(--text); }
  .wide { flex: 0 0 500px; }
  .wide .art { width: 500px; aspect-ratio: 16/9; }
  .wide .meter { margin-top: 16px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.1); }
  .wide .meter i { display: block; height: 100%; border-radius: 2px; background: var(--text); }

  .sheet { position: absolute; inset: 0; z-index: 40; background: var(--bg); }
  .sheet > img { position: absolute; right: 0; top: 0; width: 1300px; height: 100%; object-fit: cover; opacity: .6;
    mask-image: linear-gradient(90deg, transparent, #000 45%); -webkit-mask-image: linear-gradient(90deg, transparent, #000 45%); }
  .sheet .copy { top: 230px; }
</style>
</head>
<body>
<div class="stage">
  <div class="page" data-page id="page"></div>
  <div class="top" data-chrome>
    <div class="mark"><i>A</i>URORA</div>
    <nav class="links"><button data-f class="on">Home</button><button data-f>Live</button><button data-f>Films</button><button data-f>Series</button><button data-f>My list</button></nav>
    <div class="me">
      <button data-f aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search</button>
      <button data-f>Ziyad</button>
    </div>
  </div>
  <div class="sheet" data-layer hidden id="sheet"></div>
</div>
<script src="shared.js"></script>
<script>
(async () => {
  const { esc, load, start, focus } = Direction;
  const d = await load();
  const hero = d.heroes[0];
  const all = [...d.heroes, ...d.movies, ...d.shows, ...d.top, ...d.arabic, ...d.animation];
  const kind = (x) => (x.type === "tv" ? "Series" : "Film");
  const poster = (x) => `<button class="poster" data-f data-id="${x.id}"><div class="art"><img src="${esc(x.poster)}" alt=""></div><div class="t">${esc(x.title)}</div></button>`;
  const row = (title, items) => `<section data-section><h2>${esc(title)}</h2><div class="row" data-row>${items.join("")}</div></section>`;
  const two = (x) => `${esc(x.title)}.<span>${esc(x.year)} · ${kind(x)}.</span>`;

  document.getElementById("page").innerHTML = `
    <section class="hero" data-section>
      <img src="${esc(hero.backdrop)}" alt="">
      <div class="copy">
        <div class="now">Now streaming</div>
        <h1>${two(hero)}</h1>
        <p>${esc(hero.overview)}</p>
        <div class="actions"><button class="pill" data-f data-start data-id="${hero.id}">Play now →</button><button class="link" data-f data-id="${hero.id}">More about it</button></div>
      </div>
    </section>
    ${row("Continue watching", d.shows.slice(3, 8).map((x, i) => `<button class="poster wide" data-f data-id="${x.id}"><div class="art"><img src="${esc(x.still)}" alt=""></div><div class="meter"><i style="width:${[72, 35, 88, 15, 54][i]}%"></i></div><div class="t">${esc(x.title)}</div></button>`))}
    ${row("Trending this week", d.movies.map(poster))}
    ${row("Series", d.shows.map(poster))}
    ${row("All-time greats", d.top.map(poster))}
    ${row("Arabic cinema", d.arabic.map(poster))}
    ${row("Animation", d.animation.map(poster))}
    <div style="height:140px"></div>`;

  const page = document.getElementById("page");
  page.addEventListener("scroll", () => document.querySelector(".stage").classList.toggle("scrolled", page.scrollTop > 40));
  const sheet = document.getElementById("sheet");
  let opener = null;
  page.addEventListener("click", (e) => {
    const el = e.target.closest("[data-id]"); if (!el) return;
    const x = all.find((y) => String(y.id) === el.dataset.id) || hero; opener = el;
    sheet.innerHTML = `<img src="${esc(x.backdrop)}" alt=""><div class="copy"><div class="now">★ ${esc(x.rating)}</div><h1>${two(x)}</h1><p>${esc(x.overview)}</p><div class="actions"><button class="pill" data-f>Play now →</button><button class="link" data-f>Add to my list</button></div></div>`;
    sheet.hidden = false; focus(sheet.querySelector("[data-f]"));
  });
  document.addEventListener("direction:back", () => { if (!sheet.hidden) { sheet.hidden = true; focus(opener); } });
  start();
})();
</script>
</body>
</html>
